<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="樊登讲书">
<meta name="version" content="1.0.0">
<meta name="description" content="樊登讲书 · 有声书库：5 集精选音频，支持锁屏 / 熄屏播放、倍速、定时关闭与单集分享。">
<meta property="og:title" content="樊登讲书 · 有声书库">
<meta property="og:description" content="5 集精选音频，支持锁屏播放、倍速与单集分享。">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/cover-512.png">
<meta name="twitter:card" content="summary_large_image">
<title>樊登讲书 · 有声书库</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/cover-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 图标 ============ -->
<svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.2 5.4a1 1 0 0 1 1.53-.85l10.1 6.6a1 1 0 0 1 0 1.7l-10.1 6.6a1 1 0 0 1-1.53-.85z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18.6 5.7v12.6a.9.9 0 0 1-1.4.76L8.6 12.8a.95.95 0 0 1 0-1.6l8.6-6.26a.9.9 0 0 1 1.4.76z" fill="currentColor"/><path d="M6 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.4 5.7v12.6a.9.9 0 0 0 1.4.76l8.6-6.26a.95.95 0 0 0 0-1.6L6.8 4.94a.9.9 0 0 0-1.4.76z" fill="currentColor"/><path d="M18 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11V9a3 3 0 0 1 3-3h14"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 13v2a3 3 0 0 1-3 3h-14"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11V9a3 3 0 0 1 3-3h14"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 13v2a3 3 0 0 1-3 3h-14"/><path d="M11.3 10.6l1.5-1v5"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
  <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6.5 8.6H3v6.8h3.5L11 19z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.8a9 9 0 0 1 0 12.4"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6.5 8.6H3v6.8h3.5L11 19z" fill="currentColor" stroke="none"/><path d="M16 9l5 6"/><path d="M21 9l-5 6"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.7 1.7"/><path d="M9.5 2.5h5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 6.5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 19V5.5"/><path d="M8.5 7.5h7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></symbol>
</svg>

<div class="app" id="app">
  <div class="ambient" aria-hidden="true">
    <span class="ambient-a"></span>
    <span class="ambient-b"></span>
  </div>

  <!-- ============ 左侧：书目列表 ============ -->
  <aside class="sidebar" id="sidebar" aria-label="书目列表">
    <div class="side-head">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"><span>樊</span></div>
        <div class="brand-txt">
          <h1>樊登讲书</h1>
          <p>有声书库 · <span id="statTotal">5</span> 集</p>
        </div>
      </div>
      <button class="icon-btn only-mobile" id="btnCloseSide" type="button" aria-label="收起书目">
        <svg><use href="#i-close"></use></svg>
      </button>
    </div>

    <div class="search-wrap">
      <svg class="search-ico" aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="search" type="search" placeholder="搜索期号或标题…" autocomplete="off" spellcheck="false" aria-label="搜索期号或标题">
      <button class="clear-btn" id="btnClearSearch" type="button" title="清空" aria-label="清空搜索" hidden>
        <svg><use href="#i-close"></use></svg>
      </button>
    </div>

    <div class="side-tabs" role="tablist" aria-label="筛选">
      <button class="tab active" type="button" data-tab="all" role="tab" aria-selected="true">全部</button>
      <button class="tab" type="button" data-tab="fav" role="tab" aria-selected="false">收藏 <span class="pill" id="favCount">0</span></button>
      <button class="tab" type="button" data-tab="recent" role="tab" aria-selected="false">最近</button>
    </div>

    <div class="list-head">
      <label class="batch-pick" id="batchPickWrap">
        <svg aria-hidden="true"><use href="#i-book"></use></svg>
        <select id="batchFilter" aria-label="按辑筛选">
          <option value="all">全部辑</option>
        </select>
        <svg class="chev" aria-hidden="true"><use href="#i-chevron"></use></svg>
      </label>
      <span class="list-counts"><b id="shownCount">5</b> 集</span>
    </div>

    <ul class="playlist" id="playlist" role="listbox" aria-label="音频列表"></ul>

    <div class="side-foot">
      <button class="ghost-btn" id="btnShuffleAll" type="button">
        <svg aria-hidden="true"><use href="#i-shuffle"></use></svg>
        <span>随机播放全部</span>
      </button>
      <button class="version-btn" id="btnVersion" type="button" title="版本与说明">v1.0.0</button>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <!-- ============ 右侧：主播放区 ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnOpenSide" type="button" aria-label="打开书目">
        <svg><use href="#i-menu"></use></svg>
      </button>
      <div class="now-title">
        <span class="now-dot" aria-hidden="true"></span>
        <span id="nowTitle">第 176 期</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnShare" type="button" title="分享当前集" aria-label="分享当前集">
          <svg><use href="#i-share"></use></svg>
        </button>
        <button class="icon-btn only-desktop" id="btnInfo" type="button" title="版本与说明" aria-label="版本与说明">
          <svg><use href="#i-info"></use></svg>
        </button>
      </div>
    </header>

    <section class="stage">
      <div class="cover-zone">
        <div class="cover-glow" aria-hidden="true"></div>
        <div class="cover" id="cover" aria-hidden="true">
          <span class="cover-letter" id="coverLetter">樊</span>
          <span class="cover-batch" id="coverBatch">第 1 辑</span>
          <span class="cover-no" id="coverNo">176</span>
          <span class="cover-line"></span>
        </div>
        <div class="cover-shadow" aria-hidden="true"></div>
      </div>

      <div class="track-meta">
        <div class="eyebrow">
          <span id="trackBatch">第 1 辑</span>
          <i aria-hidden="true"></i>
          <span id="trackTag">讲书</span>
        </div>
        <h2 class="track-title" id="trackTitle">第 176 期</h2>
        <p class="track-sub" id="trackSub">樊登讲书 · 有声精选 · 时长 1:08:26</p>
      </div>

      <div class="progress-block">
        <div class="progress" id="progress" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="progress-track">
            <div class="progress-buffer" id="progressBuffer"></div>
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-dot" id="progressDot"></div>
        </div>
        <div class="time-row">
          <span id="curTime">00:00</span>
          <span id="durTime">1:08:26</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctl small" id="btnMode" type="button" title="列表循环" aria-label="切换播放模式">
          <svg><use href="#i-repeat"></use></svg>
        </button>
        <button class="ctl" id="btnPrev" type="button" title="上一集 (←)" aria-label="上一集">
          <svg><use href="#i-prev"></use></svg>
        </button>
        <button class="ctl primary" id="btnPlay" type="button" title="播放 / 暂停 (空格)" aria-label="播放">
          <svg><use href="#i-play"></use></svg>
        </button>
        <button class="ctl" id="btnNext" type="button" title="下一集 (→)" aria-label="下一集">
          <svg><use href="#i-next"></use></svg>
        </button>
        <button class="ctl small" id="btnFav" type="button" title="收藏" aria-label="收藏">
          <svg><use href="#i-heart"></use></svg>
        </button>
      </div>

      <div class="sub-controls">
        <div class="vol-wrap">
          <button class="ctl tiny" id="btnMute" type="button" title="静音" aria-label="静音">
            <svg><use href="#i-volume"></use></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
        </div>
        <div class="rate-wrap">
          <button class="ctl tiny" id="btnRateDown" type="button" title="减速" aria-label="减速">−</button>
          <span class="rate-label" id="rateLabel">1.0×</span>
          <button class="ctl tiny" id="btnRateUp" type="button" title="加速" aria-label="加速">＋</button>
        </div>
        <div class="sleep-wrap">
          <button class="ctl tiny" id="btnSleep" type="button" title="定时关闭" aria-label="定时关闭">
            <svg><use href="#i-timer"></use></svg>
          </button>
          <div class="popover" id="sleepPanel" hidden>
            <div class="pop-head">定时关闭</div>
            <button type="button" data-min="0"><span>关闭定时</span><svg class="check"><use href="#i-check"></use></svg></button>
            <button type="button" data-min="15"><span>15 分钟</span><svg class="check"><use href="#i-check"></use></svg></button>
            <button type="button" data-min="30"><span>30 分钟</span><svg class="check"><use href="#i-check"></use></svg></button>
            <button type="button" data-min="45"><span>45 分钟</span><svg class="check"><use href="#i-check"></use></svg></button>
            <button type="button" data-min="60"><span>60 分钟</span><svg class="check"><use href="#i-check"></use></svg></button>
            <div class="pop-note" id="sleepNote" hidden>剩余 <b>30:00</b></div>
          </div>
        </div>
      </div>

      <div class="rate-chips" id="rateChips" aria-label="播放速度">
        <button type="button" data-rate="0.75">0.75×</button>
        <button type="button" data-rate="1" class="on">1.0×</button>
        <button type="button" data-rate="1.25">1.25×</button>
        <button type="button" data-rate="1.5">1.5×</button>
        <button type="button" data-rate="1.75">1.75×</button>
        <button type="button" data-rate="2">2.0×</button>
      </div>
    </section>

    <footer class="statusbar">
      <span class="status-left">
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        <span id="statusText">就绪</span>
      </span>
      <span class="status-right" id="miniInfo">v1.0.0 · 锁屏可播放</span>
    </footer>
  </main>
</div>

<audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- ============ 版本 / 说明 ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <button class="icon-btn modal-close" id="btnCloseModal" type="button" aria-label="关闭">
      <svg><use href="#i-close"></use></svg>
    </button>
    <div class="modal-brand">
      <div class="brand-logo small" aria-hidden="true"><span>樊</span></div>
      <div>
        <h3 id="modalTitle">版本与说明</h3>
        <p id="modalVersion">v1.0.0 · 2026-11-14</p>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<noscript>
  <div class="noscript">请开启 JavaScript 后使用播放器。</div>
</noscript>

<script src="playlist.js"></script>
<script src="app.js"></script>
</body>
</html>
